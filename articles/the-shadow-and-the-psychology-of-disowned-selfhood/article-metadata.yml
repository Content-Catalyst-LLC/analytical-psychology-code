description: >
  Synthetic-data and conceptual-modeling scaffold for the article "The Shadow
  and the Psychology of Disowned Selfhood." The materials demonstrate how
  latent disowned material, ego identity, persona rigidity, cue intensity,
  affective charge, reflective capacity, shadow discrepancy, shadow activation,
  projection intensity, shame response, defensiveness, withdrawal,
  responsibility, and integration capacity can be modeled for symbolic-process
  research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, clinical decision-making, treatment recommendation,
  mental-health evaluation, crisis intervention, moral ranking, employment
  screening, workplace surveillance, individual performance management, or
  individual evaluation.
