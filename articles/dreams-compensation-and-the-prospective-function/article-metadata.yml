description: >
  Synthetic-data and conceptual-modeling scaffold for the article "Dreams,
  Compensation, and the Prospective Function." The materials demonstrate how
  conscious one-sidedness, unconscious pressure, affective intensity, latent
  growth, prior dream material, compensatory motifs, prospective motifs,
  dream-series phase shifts, symbolic centrality, and integration can be
  modeled for symbolic-process research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy, dream
  interpretation for real people, psychological assessment, clinical
  decision-making, treatment recommendation, mental-health evaluation, crisis
  intervention, employment screening, workplace surveillance, individual
  performance management, or individual evaluation.
