description: >
  Synthetic-data and conceptual-modeling scaffold for the article
  "Jung, Freud, and the Divergence of Depth Psychologies." The materials
  demonstrate how Freudian and Jungian explanatory orientations can be modeled
  through variables such as repression, sexuality conflict, infantile history,
  defense intensity, transference pressure, compensation, archetypal density,
  mythic amplification, prospective development, symbolic coherence, and
  individuation pressure.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, institutional learning, and reproducible workflows.
  They are not intended for diagnosis, therapy, psychological assessment,
  clinical decision-making, employment screening, workplace surveillance,
  individual performance management, or individual evaluation.
