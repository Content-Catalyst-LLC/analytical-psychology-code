description: >
  Synthetic-data and conceptual-modeling scaffold for the article "What Is
  Analytical Psychology?" The materials demonstrate symbolic-corpus workflows,
  motif dictionaries, symbolic co-occurrence networks, semantic clustering,
  compensation logic, concept mapping, and responsible-use safeguards for
  studying analytical psychology as a symbolic, clinical, developmental, and
  interpretive tradition.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  symbolic-process analysis, institutional learning, and reproducible workflows.
  They are not intended for diagnosis, therapy, psychological assessment,
  clinical decision-making, private dream interpretation, religious reductionism,
  employment screening, workplace surveillance, individual performance
  management, or individual evaluation.
