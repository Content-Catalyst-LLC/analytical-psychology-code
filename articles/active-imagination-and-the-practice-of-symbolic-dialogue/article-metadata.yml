description: >
  Synthetic-data and conceptual-modeling scaffold for the article "Active
  Imagination and the Practice of Symbolic Dialogue." The materials demonstrate
  how ego mediation, imaginal activation, reflective response, symbolic relation,
  ethical containment, destabilization risk, dialogue quality, and integration
  can be modeled for symbolic-process research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, clinical decision-making, treatment recommendation,
  mental-health evaluation, crisis intervention, employment screening, workplace
  surveillance, individual performance management, or individual evaluation.
