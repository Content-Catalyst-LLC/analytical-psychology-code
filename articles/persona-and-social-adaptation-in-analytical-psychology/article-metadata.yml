description: >
  Synthetic-data and conceptual-modeling scaffold for the article "Persona and
  Social Adaptation in Analytical Psychology." The materials demonstrate how
  role demand, audience reward, institutional reward, inward complexity,
  reflective flexibility, persona strength, persona rigidity, shadow pressure,
  psychic strain, burnout risk, and individuation readiness can be modeled for
  symbolic-process and social-adaptation research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, clinical decision-making, treatment recommendation,
  mental-health evaluation, employment screening, workplace surveillance,
  individual performance management, reputation scoring, social scoring, or
  individual evaluation.
