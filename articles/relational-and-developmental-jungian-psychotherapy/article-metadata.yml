description: >
  Synthetic-data and conceptual-modeling scaffold for the article
  "Relational and Developmental Jungian Psychotherapy." The materials
  demonstrate how relational safety, attachment security, affect regulation,
  rupture intensity, repair capacity, shame load, fragmentation, embodied
  safety, symbolic capacity, dream richness, reflective selfhood, and
  developmental integration can be modeled for symbolic-process research
  methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, clinical decision-making, therapist evaluation,
  employment screening, workplace surveillance, individual performance
  management, or individual evaluation.
