description: >
  Synthetic-data and conceptual-modeling scaffold for the article
  "Trauma, Dissociation, and the Fragmented Psyche." The materials demonstrate
  how affect intensity, ego integration, symbolic capacity, relational safety,
  bodily regulation, dissociation, nightmare intrusion, memory continuity,
  symbolic recovery, and integration potential can be modeled for symbolic-process
  research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, crisis assessment, risk prediction, clinical
  decision-making, treatment recommendation, employment screening, workplace
  surveillance, individual performance management, or individual evaluation.
