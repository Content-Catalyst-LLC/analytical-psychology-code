description: >
  Synthetic-data and conceptual-modeling scaffold for the article "Childhood
  Development in Jungian and Post-Jungian Thought." The materials demonstrate
  how ego differentiation, relational security, caregiver mirroring, bodily
  regulation, symbolic play, affect regulation, complex activation, family
  tension, developmental coherence, and future personality can be modeled for
  symbolic-process research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, educational evaluation, child assessment, clinical
  decision-making, treatment recommendation, employment screening, workplace
  surveillance, individual performance management, or individual evaluation.
