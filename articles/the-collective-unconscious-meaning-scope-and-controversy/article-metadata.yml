description: >
  Synthetic-data and conceptual-modeling scaffold for the article "The
  Collective Unconscious: Meaning, Scope, and Controversy." The materials
  demonstrate how symbolic recurrence, motif co-occurrence, archetypal patterning,
  semantic networks, latent structural hypotheses, cultural context, personal
  context, transmission alternatives, and responsible interpretive guardrails
  can be modeled for symbolic-process and corpus-based research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, corpus exploration,
  institutional learning, and reproducible workflows. They are not intended for
  diagnosis, therapy, psychological assessment, private dream interpretation,
  religious reductionism, cultural extraction, employment screening, workplace
  surveillance, individual performance management, or individual evaluation.
