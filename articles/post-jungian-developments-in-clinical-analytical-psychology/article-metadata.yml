description: >
  Synthetic-data and conceptual-modeling scaffold for the article
  "Post-Jungian Developments in Clinical Analytical Psychology." The materials
  demonstrate how symbolic depth, relational sophistication, developmental
  precision, trauma sensitivity, embodied regulation, cultural responsiveness,
  doctrinal rigidity, symbolic readiness, balance, and clinical adequacy can be
  modeled for educational and research-methods purposes.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, institutional learning, and reproducible workflows.
  They are not intended for diagnosis, therapy, psychological assessment,
  clinical decision-making, employment screening, workplace surveillance,
  individual performance management, or individual evaluation.
