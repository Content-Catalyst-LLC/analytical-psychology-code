description: >
  Synthetic-data and conceptual-modeling scaffold for the article "The Personal
  Unconscious and the Theory of Complexes." The materials demonstrate how
  personal-unconscious contents, complex activation, affective charge,
  associative clustering, trigger intensity, relational threat, shame cues,
  guilt cues, evaluation pressure, regulation, contextual support, projection,
  transference, and affect-weighted network dynamics can be modeled for
  symbolic-process and depth-psychology research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, clinical decision-making, treatment recommendation,
  mental-health evaluation, employment screening, workplace surveillance,
  individual performance management, or individual evaluation.
