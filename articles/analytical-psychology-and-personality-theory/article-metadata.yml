description: >
  Synthetic-data and conceptual-modeling scaffold for the article "Analytical
  Psychology and Personality Theory." The materials demonstrate how conscious
  orientation, persona identification, shadow acknowledgment, complex activation,
  unconscious compensation, typological flexibility, symbolic relation, reflective
  capacity, developmental integration, one-sidedness, and personality-state
  dynamics can be modeled for symbolic-process research methods.
responsible_use: >
  These materials are for synthetic-data research, methods demonstration,
  conceptual modeling, symbolic-process analysis, institutional learning, and
  reproducible workflows. They are not intended for diagnosis, therapy,
  psychological assessment, personality assessment, clinical decision-making,
  hiring, employment screening, workplace surveillance, individual performance
  management, or individual evaluation.
