description: >
  Synthetic-data and public-domain-corpus scaffold for the article "Myth,
  Symbol, and the Archetypal Imagination." The materials demonstrate how
  symbolic recurrence, historical context, motif co-occurrence, archetypal
  neighborhoods, source-type differences, political myth, and context-dependence
  can be modeled for symbolic-process research methods.
responsible_use: >
  These materials are for synthetic-data research, public-domain corpus
  demonstration, conceptual modeling, symbolic-process analysis, institutional
  learning, and reproducible workflows. They are not intended to prove archetypes,
  appropriate sacred traditions, interpret private dreams, classify religions,
  rank cultures, evaluate communities, automate myth interpretation, or replace
  historical, anthropological, theological, literary, political, or clinical
  expertise.
